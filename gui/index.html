<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>opencodex · proxy dashboard</title>
    <script>
      // FOWT guard: apply an explicit light/dark choice before first paint. "system" leaves the
      // attribute unset so color-scheme:light-dark follows the OS. Mirrors App.tsx.
      (function () {
        try {
          var t = localStorage.getItem("ocx-theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
        try {
          var l = localStorage.getItem("ocx-lang");
          var map = { zh: "zh-CN", "zh-TW": "zh-TW", ko: "ko", ja: "ja", de: "de", fr: "fr", ru: "ru", tr: "tr", vi: "vi", en: "en" };
          if (l && map[l]) {
            document.documentElement.lang = map[l];
          } else {
            var nav = (navigator.language || "").toLowerCase();
            if (nav.startsWith("zh")) {
              document.documentElement.lang = (nav.includes("tw") || nav.includes("hk") || nav.includes("mo") || nav.includes("hant")) ? "zh-TW" : "zh-CN";
            } else if (nav.startsWith("ko")) {
              document.documentElement.lang = "ko";
            } else if (nav.startsWith("ja")) {
              document.documentElement.lang = "ja";
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
